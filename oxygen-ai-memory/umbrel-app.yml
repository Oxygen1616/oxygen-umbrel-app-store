description: >-
  AI Memory is a long-term memory service for coding agent CLIs. It helps hand off context between different agent vendors and keeps state across sessions.


  The app exposes an MCP HTTP endpoint at /mcp. Point Claude Code or any MCP HTTP client at it, and state is kept in the app's data directory.
