services:
  app_proxy:
    environment:
      APP_HOST: oxygen-hindsight_server_1
      APP_PORT: 9999
      PROXY_AUTH_ADD: "false"

  permissions:
    image: alpine:latest
    user: "0:0"
    restart: "no"
    command:
      - sh
      - -c
      - |
        mkdir -p /home/hindsight/.pg0
        chown -R 1000:1000 /home/hindsight/.pg0
        chmod -R u+rwX /home/hindsight/.pg0
    volumes:
      - ${APP_DATA_DIR}/data:/home/hindsight/.pg0

  server:
    image: ghcr.io/vectorize-io/hindsight:latest
    restart: on-failure
    depends_on:
      permissions:
        condition: service_completed_successfully
    ports:
      - "8889:8888"
    environment:
      # Set these in the Compose environment, or assign values here on Umbrel.
      # Provider names and setup: https://hindsight.vectorize.io/developer/models
      - HINDSIGHT_API_LLM_PROVIDER=${HINDSIGHT_API_LLM_PROVIDER:-openai}
      - HINDSIGHT_API_LLM_API_KEY=${HINDSIGHT_API_LLM_API_KEY:-}
      # Leave unset to use the selected provider's default model and endpoint.
      - HINDSIGHT_API_LLM_MODEL
      - HINDSIGHT_API_LLM_BASE_URL
      # Custom OpenAI-compatible API: provider=openai, model=<model-id>,
      # base URL=https://your-provider.example/v1 (include /v1 if required).
      # Local servers: use host.docker.internal or a LAN address, not localhost.
    volumes:
      - ${APP_DATA_DIR}/data:/home/hindsight/.pg0
    extra_hosts:
      - "host.docker.internal:host-gateway"
