id: oxygen-pegaprox
name: PegaProx
tagline: Manage Proxmox VE and XCP-ng clusters from one dashboard
icon: https://raw.githubusercontent.com/PegaProx/project-pegaprox/v1.2.0/images/pegaprox-logo-square-dark.png
category: networking
version: "1.2.0-1"
port: 5000
description: >-
  PegaProx is a web-based management interface for Proxmox VE and XCP-ng clusters.
  Manage multiple clusters from a single dashboard with live monitoring,
  virtual machine management, snapshots, backups, and automated tasks.


  Open the app to complete its initial setup. VNC and SSH consoles use ports
  5001 and 5002. Configuration, the embedded database, encryption keys, logs,
  and backups are persisted in the app's data directory.
