services:
  app_proxy:
    environment:
      APP_HOST: oxygen-pegaprox_server_1
      APP_PORT: 5000

  permissions:
    image: ghcr.io/pegaprox/pegaprox:1.2.0@sha256:8c406ad6b2ddf9dc252e468db6b1bd730ffe11a748a16e3a86d28dc77e438536
    user: "0:0"
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - chown -R pegaprox:pegaprox /app/config /app/logs /app/backups /app/.config/pegaprox
    volumes:
      - ${APP_DATA_DIR}/data/config:/app/config
      - ${APP_DATA_DIR}/data/logs:/app/logs
      - ${APP_DATA_DIR}/data/backups:/app/backups
      - ${APP_DATA_DIR}/data/keys:/app/.config/pegaprox

  server:
    image: ghcr.io/pegaprox/pegaprox:1.2.0@sha256:8c406ad6b2ddf9dc252e468db6b1bd730ffe11a748a16e3a86d28dc77e438536
    restart: on-failure
    stop_grace_period: 1m
    depends_on:
      permissions:
        condition: service_completed_successfully
    environment:
      PEGAPROX_BEHIND_PROXY: "true"
    volumes:
      - ${APP_DATA_DIR}/data/config:/app/config
      - ${APP_DATA_DIR}/data/logs:/app/logs
      - ${APP_DATA_DIR}/data/backups:/app/backups
      - ${APP_DATA_DIR}/data/keys:/app/.config/pegaprox
    ports:
      - "5001:5001" # VNC websocket
      - "5002:5002" # SSH websocket
