services:
  app_proxy:
    environment:
      APP_HOST: oxygen-opendots_server_1
      APP_PORT: 4310
      PROXY_AUTH_ADD: "false"

  permissions:
    image: alpine:latest
    user: "0:0"
    restart: "no"
    command:
      - sh
      - -c
      - |
        mkdir -p /data
        chown -R 1000:1000 /data
        chmod -R u+rwX /data
    volumes:
      - ${APP_DATA_DIR}/data:/data

  server:
    image: xiaosong233/opendots-railway:latest
    restart: on-failure
    depends_on:
      permissions:
        condition: service_completed_successfully
    environment:
      - HOST=0.0.0.0
      - PORT=4310
      - DATABASE_PATH=/data/opendots.sqlite
      - OWNER_ID=opendots-owner
      - OWNER_TOKEN=${APP_PASSWORD:-opendots-owner-token-secure-24}
      - APP_ORIGIN=http://umbrel.local:4310
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://host.docker.internal:11434/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
    volumes:
      - ${APP_DATA_DIR}/data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
