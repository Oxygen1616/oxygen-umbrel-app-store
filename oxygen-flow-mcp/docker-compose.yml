version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: oxygen-flow-mcp_server_1
      APP_PORT: 8787
      PROXY_AUTH_ADD: "false"

  permissions:
    image: alpine:latest
    user: "0:0"
    restart: "no"
    command:
      - sh
      - -c
      - |
        mkdir -p /data
        chmod -R u+rwX,go+rX /data
    volumes:
      - ${APP_DATA_DIR}/data:/data

  server:
    image: ghcr.io/oxygen1616/flow-mcp:latest
    restart: on-failure
    depends_on:
      permissions:
        condition: service_completed_successfully
    environment:
      - NODE_ENV=production
      - FLOW_MCP_PORT=8787
      - FLOW_MCP_BIND=0.0.0.0
      - FLOW_MCP_HOME=/data/.flow-mcp
      - FLOW_MCP_ALLOW_LAN_STUDIO=true
      - FLOW_MCP_ALLOW_HOSTS=*
      # Stable API token for n8n and other clients; shown as the app password in Umbrel.
      - FLOW_MCP_TOKEN=${APP_PASSWORD}
    # Chrome's DevTools refuses Host headers that are not an IP or localhost, so
    # resolve the Brave container to an IP and use its DevTools relay on 9223.
    command:
      - sh
      - -c
      - |
        for i in $$(seq 1 60); do
          BRAVE_IP=$$(getent hosts oxygen-brave_web_1 | awk '{print $$1}')
          [ -n "$$BRAVE_IP" ] && break
          sleep 2
        done
        if [ -z "$$BRAVE_IP" ]; then echo "flow-mcp: could not resolve oxygen-brave_web_1" >&2; exit 1; fi
        export FLOW_MCP_CDP_URL="http://$${BRAVE_IP}:9223"
        echo "flow-mcp: using Brave DevTools at $$FLOW_MCP_CDP_URL"
        exec node dist/index.js
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${APP_DATA_DIR}/data:/data
