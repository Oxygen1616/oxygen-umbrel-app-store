description: >-
  DBX is an ultra-lightweight (25MB) open-source database client and management tool supporting over 100 database systems including MySQL, PostgreSQL, SQLite, Redis, MongoDB, ClickHouse, DuckDB, SQL Server, and Oracle.


  It features a built-in AI SQL assistant, Model Context Protocol (MCP) server support for AI coding agents (Claude Code, Cursor, Windsurf), visual query execution plans, schema diffs, data transfer, and specialized key-value browsers.


  Key Features:


  🗄️ 100+ Databases in One Tool: Connect to relational, NoSQL, time-series, and analytical databases with one unified UI.


  🤖 Built-in AI Assistant: Natural language to SQL generation, schema-aware queries, query optimization, and error explanation.


  🔌 Model Context Protocol (MCP): Connect your AI coding agents directly to your databases securely.


  📊 Visual Tools: Visual EXPLAIN execution plans, schema comparisons, data import/export, and instant grid editing.
