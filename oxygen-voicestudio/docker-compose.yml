services:
  app_proxy:
    environment:
      APP_HOST: oxygen-voicestudio_server_1
      APP_PORT: 3900
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/debpalash/voicestudio:latest
    restart: on-failure
    environment:
      - HF_HOME=/app/omnivoice_data/huggingface
      - HF_TOKEN=
      - OMNIVOICE_DATA_DIR=/app/omnivoice_data
      - PYTHONPATH=/app/backend
      - PYTHONUNBUFFERED=1
      - OMNIVOICE_BIND_HOST=0.0.0.0
      - OMNIVOICE_SERVER_MODE=1
      - OMNIVOICE_API_KEY=${APP_PASSWORD:-adminadmin}
    volumes:
      - ${APP_DATA_DIR}/data:/app/omnivoice_data
    extra_hosts:
      - "host.docker.internal:host-gateway"
