version: '3.7'

services:
  app_proxy:
    environment:
      APP_HOST: oxygen-brave_web_1
      APP_PORT: 3000

  web:
    image: ghcr.io/linuxserver/brave:1.79.126@sha256:82448700fd7125d71740d08350caaa58275cf8dcc556203c34fb715855b5db22
    restart: on-failure
    ports:
      - 3935:3001
    healthcheck:
      test: timeout 10s bash -c ':> /dev/tcp/127.0.0.1/3000' || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    security_opt:
      - no-new-privileges:true
    shm_size: "1gb"
    volumes:
      - ${APP_DATA_DIR}/data:/config:rw
      # Flow MCP tells Brave to save downloads here and watches the same folder, so it must be the same path in both.
      - ${UMBREL_ROOT}/app-data/oxygen-flow-mcp/data/.flow-mcp/downloads:/data/.flow-mcp/downloads
    environment:
      PUID: 1000
      PGID: 1000
      # The linuxserver image launches Brave with ${BRAVE_CLI}; CHROME_CLI is ignored.
      # Chromium 136+ ignores --remote-debugging-port on the default profile folder, so
      # the DevTools-enabled session uses its own profile. DevTools stays on 127.0.0.1
      # and is only reachable through cdp_relay on the internal network.
      BRAVE_CLI: "--remote-debugging-port=9222 --user-data-dir=/config/flow-profile https://labs.google/fx/tools/flow"

  # Chromium ignores --remote-debugging-address outside headless mode, so DevTools only
  # listens on 127.0.0.1 inside the web container. This relay shares that network
  # namespace and forwards 9223 to it, so Flow MCP can reach DevTools over Umbrel's
  # internal Docker network. No port is published to the LAN.
  cdp_relay:
    image: alpine/socat:1.8.0.3@sha256:a114a8c813b25db7fd25e8bc521acfe04b39eeeb9772e61520c91ebf6fdbd401
    restart: on-failure
    network_mode: service:web
    depends_on: [web]
    command: TCP-LISTEN:9223,fork,reuseaddr TCP:127.0.0.1:9222
