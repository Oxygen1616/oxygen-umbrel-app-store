description: >-
  Baserow is an open-source no-code platform that combines an Airtable-style relational database, a visual Application Builder, workflow automations, and a native Model Context Protocol (MCP) server into a single self-hosted suite.


  Key Features:

  📊 Relational No-Code Databases: Create tables, views (Grid, Kanban, Calendar, Timeline, Form, Gallery), formulas, lookups, and linked records without writing SQL.

  🤖 Built-in MCP Server for AI Agents (Hermes, Murmur, OpenClaw, Claude): Expose any workspace to AI agents via Streamable HTTP (`POST /mcp`) or SSE (`GET /mcp/<key>/sse`) so agents can list databases, inspect table schemas, and create/update/query rows autonomously.

  🔗 Instant REST API & Webhooks: Every table automatically generates documented REST endpoints (`/api/database/rows/table/{table_id}/`) and private-network-enabled webhooks for n8n, NoCode ToolsKit, and custom scripts.

  🛠️ Application Builder & Dashboards: Build internal tools, portals, and dashboards directly on top of your Baserow tables.


  HOW TO CONNECT FROM HERMES AGENT, MURMUR, N8N & OTHER TOOLS

  1. Web UI (works on LAN, mDNS, and Tailscale):
     - http://umbrel.local:8590
     - http://192.168.1.15:8590
     - http://100.126.75.31:8590

  2. Built-in MCP Server (for Hermes Agent, Murmur, OpenClaw, Claude):
     - In Baserow, click your user menu (top-left) -> Settings -> MCP Server -> Create MCP Endpoint, and copy your `<MCP_KEY>`.
     - Internal Docker URL (recommended for Hermes / Murmur on Umbrel):
       • Streamable HTTP: `http://oxygen-baserow_web_1/mcp` with header `Authorization: Bearer <MCP_KEY>`
       • SSE Endpoint: `http://oxygen-baserow_web_1/mcp/<MCP_KEY>/sse`
     - Host / LAN URL:
       • Streamable HTTP: `http://192.168.1.15:8590/mcp` (header `Authorization: Bearer <MCP_KEY>`)
       • SSE Endpoint: `http://192.168.1.15:8590/mcp/<MCP_KEY>/sse`

  3. REST API (for n8n Baserow node, HTTP Request nodes, & scripts):
     - In Baserow, go to Settings -> Database tokens -> Create token.
     - Host / Base URL: `http://oxygen-baserow_web_1` (internal Docker) or `http://192.168.1.15:8590` (LAN)
     - Header: `Authorization: Token <YOUR_DATABASE_TOKEN>`
