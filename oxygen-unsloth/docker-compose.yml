services:
  app_proxy:
    environment:
      APP_HOST: oxygen-unsloth_web_1
      APP_PORT: 8000
      PROXY_AUTH_ADD: "false"

  web:
    image: unsloth/unsloth:latest
    restart: on-failure
    ipc: host
    environment:
      - JUPYTER_PASSWORD=adminadmin
      - UNSLOTH_STUDIO_PASSWORD=adminadmin
      - UNSLOTH_STUDIO_BOOTSTRAP_TIMEOUT=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    ports:
      - "8888:8888"
    volumes:
      - ${APP_DATA_DIR}/data:/workspace/work
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
