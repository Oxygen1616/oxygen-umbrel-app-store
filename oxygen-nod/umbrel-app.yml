description: >-
  Nod (by n8n) is an open-source personal AI agent that works across Gmail, Calendar, Slack, Notion, and the web — remembering your preferences, running scheduled checks, and asking for your approval before acting for you.


  Run Nod locally on your Umbrel with your choice of AI provider (OpenAI, Anthropic, Gemini, OpenRouter, Ollama, DeepSeek, Groq, and more) backed by persistent PostgreSQL storage.


  FEATURES


  • Persistent Memory & Rules: Teach Nod your preferences and rules once and it remembers them across tasks.

  • Approval Gates: Drafts emails, messages, and actions, then pauses for your explicit approval before sending.

  • Scheduled Checks: Monitor pages, calendars, or inboxes on a schedule and notify you when something changes.

  • Multi-Provider Models: Supports OpenAI, Anthropic, Gemini, OpenRouter, Ollama, and OpenAI-compatible endpoints.


  HOW TO CONFIGURE

  1. Open Nod from your Umbrel app drawer (first launch installs dependencies and builds the web UI).

  2. Connect your preferred AI model provider or ChatGPT Plus/Pro account in Nod's onboarding or Settings.
