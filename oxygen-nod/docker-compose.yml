version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: oxygen-nod_server_1
      APP_PORT: 4310
      PROXY_AUTH_ADD: "false"

  permissions:
    image: alpine:latest
    user: "0:0"
    restart: "no"
    command:
      - sh
      - -c
      - |
        mkdir -p /data/nod-data /data/pnpm-store
        chmod 755 /data /data/pnpm-store
        chmod 700 /data/nod-data
    volumes:
      - ${APP_DATA_DIR}/data:/data

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      permissions:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: nod
      POSTGRES_PASSWORD: ${APP_SEED}
      POSTGRES_DB: nod
    volumes:
      - ${APP_DATA_DIR}/data/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nod"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  server:
    image: node:24-bookworm-slim
    restart: unless-stopped
    init: true
    shm_size: "1g"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      permissions:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=4310
      - NOD_HOST=0.0.0.0
      - NOD_ALLOW_LAN=true
      - NOD_AUTH_TOKEN=${APP_PASSWORD}
      - NOD_DATA_ROOT=/data/nod-data
      - NOD_POSTGRES_PASSWORD=${APP_SEED}
      - DATABASE_URL=postgres://nod:${APP_SEED}@postgres:5432/nod
      - PNPM_HOME=/data/pnpm-store
    volumes:
      - ${APP_DATA_DIR}/data:/data
    working_dir: /data
    command:
      - /bin/bash
      - -ec
      - |
        cd /data

        if [ ! -f /data/app/dist/web/index.html ] || [ ! -d /data/app/node_modules ]; then
          echo "Setting up n8n Nod for the first time..."
          apt-get update && apt-get install -y --no-install-recommends git curl ca-certificates python3 make g++ && rm -rf /var/lib/apt/lists/*
          corepack enable

          if [ ! -f /data/app/package.json ]; then
            rm -rf /data/app
            git clone --depth 1 https://github.com/n8n-io/nod.git /data/app
          fi

          cd /data/app
          if [ ! -f /data/app/.env ] && [ -f /data/app/.env.example ]; then
            cp /data/app/.env.example /data/app/.env
          fi

          rm -rf /data/app/node_modules
          pnpm install --frozen-lockfile --prod=false
          pnpm exec vite build
        fi

        # Allow LAN hosts/same-origin requests (e.g. umbrel.local:8798, 192.168.1.15:8798) when NOD_ALLOW_LAN=true
        node -e 'const fs=require("fs"),f="/data/app/src/server/access.ts";if(fs.existsSync(f)){let s=fs.readFileSync(f,"utf8");if(!s.includes("NOD_ALLOW_LAN")){s=s.replace("if (!hosts.has(request.headers.host || '\'''\''))","if (process.env.NOD_ALLOW_LAN !== '\''true'\'' && !hosts.has(request.headers.host || '\'''\''))").replace("!hosts.has(requested.host)","(process.env.NOD_ALLOW_LAN === '\''true'\'' ? requested.host !== (request.headers.host || '\'''\'') : !hosts.has(requested.host))");fs.writeFileSync(f,s);}}'

        # Inject crypto.randomUUID polyfill for non-HTTPS LAN access (e.g. http://umbrel.local:8798)
        node -e 'const fs=require("fs");const poly="<script>if(typeof crypto!==\"undefined\"&&typeof crypto.randomUUID!==\"function\"){crypto.randomUUID=function(){var b=new Uint8Array(16);crypto.getRandomValues(b);b[6]=(b[6]&0x0f)|0x40;b[8]=(b[8]&0x3f)|0x80;var h=Array.from(b,function(x){return x.toString(16).padStart(2,\"0\")}).join(\"\");return h.slice(0,8)+\"-\"+h.slice(8,12)+\"-\"+h.slice(12,16)+\"-\"+h.slice(16,20)+\"-\"+h.slice(20)};}</script>";for(const f of ["/data/app/dist/web/index.html","/data/app/index.html"]){if(fs.existsSync(f)){let s=fs.readFileSync(f,"utf8");if(!s.includes("crypto.randomUUID=function")&&s.includes("<head>")){fs.writeFileSync(f,s.replace("<head>","<head>"+poly));}}}'

        chmod 700 /data/nod-data
        cd /data/app
        echo "Starting n8n Nod on 0.0.0.0:4310..."
        exec ./node_modules/.bin/tsx src/server/index.ts
