description: >-
  OpenMausBot (also known as MausBot, formerly OpenGrokBot) is an open-source alternative to Grok Bot, Meta Muse, OpenAI dots, and Cue by Manus. It provides your own self-hosted team of AI bots inside a modern, local-first chat workspace.


  Every bot in your sidebar is a real persistent agent — powered by models you already have (Claude Code, Codex, Grok, and custom ACP/MCP tools) — with its own personality, model parameters, cloud computer, and connected apps. Talk to them like teammates, watch them execute tasks, and approve critical actions.


  All transcripts, API keys, workspaces, and SQLite conversation history are stored securely and privately on your Umbrel storage.


  HOW TO USE

  1. Install OpenMausBot from the Oxygen App Store.

  2. Open OpenMausBot on your Umbrel (port 8799) to view the web interface and pairing status.

  3. Connect the Desktop App or Phone:
     Run in your Umbrel terminal / SSH:
     docker exec -it oxygen-openmausbot_server_1 /data/bin/bin/openmausbot pair
     Paste the generated pairing link into your desktop app or scan the QR code with your mobile camera.

  4. Configure AI Engine Keys (e.g., Claude, OpenAI, or local models):
     Run in your terminal:
     docker exec -it oxygen-openmausbot_server_1 /data/bin/bin/openmausbot engine set claude --key-env ANTHROPIC_API_KEY
     or configure providers directly from the Settings screen.
