version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: oxygen-openmausbot_server_1
      APP_PORT: 8799
      PROXY_AUTH_ADD: "false"

  permissions:
    image: alpine:latest
    user: "0:0"
    restart: "no"
    command:
      - sh
      - -c
      - |
        mkdir -p /data/openmausbot /data/bin
        chmod -R u+rwX,go+rX /data
        chown -R 1000:1000 /data
    volumes:
      - ${APP_DATA_DIR}/data:/data

  server:
    image: node:24-bookworm-slim
    restart: unless-stopped
    init: true
    shm_size: "1g"
    depends_on:
      permissions:
        condition: service_completed_successfully
    environment:
      - HOME=/data/openmausbot
      - OMB_PORT=8799
      - OMB_DATA_DIR=/data/openmausbot
      - OMB_SERVER_NAME=OpenMausBot-Umbrel
      - OMB_DEFAULT_PAIRING_CODE=UMBRMAUS8799
      - NPM_CONFIG_PREFIX=/data/bin
      - PATH=/data/bin/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - ${APP_DATA_DIR}/data:/data
    command:
      - /bin/bash
      - -ec
      - |
        # Ensure system tools for agent CLIs
        if ! command -v git >/dev/null 2>&1 || ! command -v curl >/dev/null 2>&1; then
          echo "Installing system packages..."
          apt-get update && apt-get install -y --no-install-recommends git curl ca-certificates && rm -rf /var/lib/apt/lists/*
        fi

        # Persistently install openmausbot CLI if not already installed
        if [ ! -f /data/bin/bin/openmausbot ]; then
          echo "Installing OpenMausBot from npm..."
          npm install -g --prefix /data/bin openmausbot@0.1.175
        fi

        # Support deterministic initial pairing code on startup for Umbrel credential modal
        node -e 'const fs=require("fs"),f="/data/bin/lib/node_modules/openmausbot/dist-server/index.js";if(fs.existsSync(f)){let s=fs.readFileSync(f,"utf8");const re=/code=(?:\([^)]*OMB_DEFAULT_PAIRING_CODE[^)]*\)\?process\.env\.OMB_DEFAULT_PAIRING_CODE:)?generatePairingCode\(\)/;const patch="code=(process.env.OMB_DEFAULT_PAIRING_CODE&&!this.pairings.some(p=>!p.browser))?process.env.OMB_DEFAULT_PAIRING_CODE:generatePairingCode()";if(re.test(s)){fs.writeFileSync(f,s.replace(re,patch));}}'

        # Auto-mint pairing code on startup and log prominently
        (
          for i in $$(seq 1 30); do
            sleep 2
            if curl -sf http://127.0.0.1:8799/api/health >/dev/null 2>&1; then
              break
            fi
          done
          echo ""
          echo "================================================================"
          echo ">>> OPENMAUSBOT PAIRING CODE (ACTIVE FOR 24 HOURS):"
          /data/bin/bin/openmausbot pair --ttl 24h | tee /data/openmausbot/current_pairing.txt
          echo "================================================================"
          echo ""
        ) &

        echo "Starting OpenMausBot server on port 8799..."
        exec /data/bin/bin/openmausbot serve --lan --port 8799 --data-dir /data/openmausbot --no-open --no-pair
