manifestVersion: 1
id: oxygen-flow-mcp-2
name: Flow MCP 2
tagline: AI Video Automation Engine for Google Flow (Instance 2)
icon: https://raw.githubusercontent.com/Oxygen1616/oxygen-umbrel-app-store/master/oxygen-flow-mcp/logo.png
category: AI
version: "0.2.7"
port: 8788
description: >-
  Flow MCP 2 is an automation engine and MCP server for Google Flow (Instance 2). It automates generation of AI video shots, character edits, narration audio, video assembly, and animated subtitles directly from prompts or API requests.


  HOW TO USE

  1. Ensure Brave 2 (oxygen-brave-2) is installed and running on your Umbrel.

  2. Open Brave 2 (oxygen-brave-2) on your Umbrel and log into your second Google Account at https://labs.google/fx/tools/flow once so your session cookies are saved.

  3. Flow MCP 2 connects to Brave 2 and exposes:
     - Flow Studio Web UI: http://umbrel.local:8788
     - REST API: POST /api/project, POST /api/generate, POST /api/assemble, POST /api/captions
     - MCP Tools for n8n, Claude Code, and other AI agents.
   - MCP over HTTP for other apps on your Umbrel (Hermes Agent, Murmur): http://<umbrel-ip>:8788/mcp with the header "Authorization: Bearer <token>". The token is the one n8n uses.
developer: GTAI-1
website: https://github.com/Oxygen1616/flow-mcp
submitter: Oxygen1616
submission: https://github.com/Oxygen1616/oxygen-umbrel-app-store
repo: https://github.com/Oxygen1616/flow-mcp
support: https://github.com/Oxygen1616/flow-mcp/issues
gallery:
  - https://raw.githubusercontent.com/Oxygen1616/oxygen-umbrel-app-store/master/oxygen-flow-mcp/logo.png
releaseNotes: >-
  v0.2.7: Second instance support connected to oxygen-brave-2.
dependencies:
  - oxygen-brave-2
path: "/"
defaultUsername: ""
defaultPassword: ""
