description: >-
  Rendiv Studio is an open-source, code-first video editor and headless rendering framework built specifically for AI agents, LLM pipelines, and automated video production.


  Every video composition is written in React and TypeScript as a pure, deterministic function of time. AI agents (like Claude Code, Codex, Hermes, or Agent Zero) can programmatically generate, edit, and iterate on compositions from natural language prompts with zero manual keyframing.


  Key Features:


  🎬 Interactive Browser Studio: Scrubber, live preview, timeline editor with multi-track z-ordering, and hot reload.


  🤖 Preloaded AI Agent Skills: Built-in Claude Code, Codex, and rendiv-video skills ready to compose videos.


  ⚡ Parallel Headless Rendering: Uses Playwright and FFmpeg to render MP4, WebM, and GIF files at scale.


  🔌 Agent-Accessible REST/WebSocket API: Direct API access on port 3000 without proxy authentication hurdles, allowing local agents and scripts on your Umbrel to trigger renders and manage projects.
