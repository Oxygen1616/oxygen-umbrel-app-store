version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: oxygen-youtubepro_server_1
      APP_PORT: 5000
      PROXY_AUTH_ADD: "false"

  permissions:
    image: alpine:latest
    user: "0:0"
    restart: "no"
    command:
      - sh
      - -c
      - |
        mkdir -p /data
        chmod -R 777 /data
    volumes:
      - ${APP_DATA_DIR}/data:/data

  server:
    image: node:22-bookworm-slim
    restart: unless-stopped
    init: true
    shm_size: "1g"
    depends_on:
      permissions:
        condition: service_completed_successfully
    environment:
      - NODE_ENV=production
      - PORT=5000
      - HOST=0.0.0.0
      - ALLOW_REMOTE_SETTINGS=true
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_TEXT_MODEL=${GEMINI_TEXT_MODEL:-gemini-3.7-flash}
      - GEMINI_IMAGE_MODEL=${GEMINI_IMAGE_MODEL:-gemini-3.1-flash-image}
    volumes:
      - ${APP_DATA_DIR}/data:/data
    working_dir: /data
    command:
      - /bin/bash
      - -ec
      - |
        cd /data
        if [ ! -f /data/app/dist/index.cjs ]; then
          echo "Setting up YouTube Pro for the first time..."
          apt-get update && apt-get install -y --no-install-recommends git ca-certificates && rm -rf /var/lib/apt/lists/*
          if [ ! -f /data/app/package.json ]; then
            rm -rf /data/app
            git clone --depth 1 https://github.com/AgriciDaniel/youtubepro.git /data/app
          fi
          cd /data/app
          node -e "const fs=require('fs');const f='server/settings.ts';if(fs.existsSync(f)){fs.writeFileSync(f,fs.readFileSync(f,'utf8').replace('export function isLocalSettingsRequest(req: Request): boolean {','export function isLocalSettingsRequest(req: Request): boolean {\n  if (process.env.ALLOW_REMOTE_SETTINGS) return true;'));}"
          npm install --include=dev
          npm run build
        fi

        cd /data/app
        echo "Starting YouTube Pro on 0.0.0.0:5000..."
        exec node dist/index.cjs
