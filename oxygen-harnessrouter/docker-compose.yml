services:
  app_proxy:
    environment:
      APP_HOST: oxygen-harnessrouter_server_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"

  server:
    image: harnessrouter/harnessrouter:0.25.15
    restart: on-failure
    environment:
      - HR_AUTH_USER=harnessrouter
      - HR_AUTH_PASSWORD=adminadmin
    volumes:
      - ${APP_DATA_DIR}/data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
