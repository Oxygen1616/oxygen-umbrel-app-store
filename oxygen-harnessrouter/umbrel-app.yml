description: >-
  HarnessRouter is an open-source infrastructure layer that turns existing agent harnesses (like Claude Code, Codex, Hermes, OpenCode, and others) into plug-and-play agent backends.


  It implements the Unified Harness Protocol (UHP) and provides an OpenAI Responses-compatible API, handling persistent sessions, streaming progress, workspaces, cancellation, and structured failures.


  Key Features:


  🌐 Single API Integration: Manage multiple agent harnesses through a single unified endpoint without building separate backend integrations for each agent.


  🔄 Universal Agent Switching: Switch between harnesses (Claude Code, Codex, Hermes, Gemini CLI, etc.) to optimize cost and latency per task.


  💻 Built-in Web Console: Manage sessions, inspect agent executions, configure BYOK model providers, and generate API keys from a clean dashboard.


  🔒 Isolated & Secure: Each agent CLI runs under its own per-session user with dedicated workspace isolation, ensuring files and credentials never leak between sessions.
