version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: oxygen-rakazo_web_1
      APP_PORT: 5173
      PROXY_AUTH_ADD: "false"

  permissions:
    image: alpine:latest
    user: "0:0"
    restart: "no"
    command:
      - sh
      - -c
      - |
        mkdir -p /data/app /data/postgres
        chown -R 1000:1000 /data/app
        chmod -R 777 /data/app /data/postgres
    volumes:
      - ${APP_DATA_DIR}/data:/data

  postgres:
    image: postgres:16
    restart: on-failure
    environment:
      POSTGRES_USER: rakazo
      POSTGRES_PASSWORD: rakazo_db_pass_9f8e7d6c5b4a
      POSTGRES_DB: rakazo
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data

  supervisor:
    image: ghcr.io/elie222/rakazo/app:edge
    restart: on-failure
    command: ["pnpm", "--filter", "@rakazo/sandbox-supervisor", "start"]
    user: root
    environment:
      MAX_UPLOAD_SIZE_MB: 10
      DATA_DIR: /data
      SUPERVISOR_HOST: "0.0.0.0"
      SUPERVISOR_PORT: "7091"
      DOCKER_SOCKET: /var/run/docker.sock
      RAKAZO_COMPUTER_IMAGE: ghcr.io/elie222/rakazo/computer:edge
      RAKAZO_COMPUTER_MEMORY: 2g
      RAKAZO_COMPUTER_CPUS: 2
      RAKAZO_COMPUTER_PIDS_LIMIT: 2048
      SANDBOX_COMMAND_TIMEOUT_MS: 300000
      SANDBOX_SUPERVISOR_TOKEN: 3f8a1c9e5b2d7048a1c3e5f7b9d024681a3c5e7f9b0d2f4a6c8e0b2d4f6a8c0e
      SANDBOX_SCREEN_NETWORK: isolated
      SANDBOX_COMPUTER_EGRESS: open
      LOG_LEVEL: info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${APP_DATA_DIR}/data/app:/data
    depends_on:
      permissions:
        condition: service_completed_successfully

  api:
    image: ghcr.io/elie222/rakazo/app:edge
    restart: on-failure
    command:
      - bash
      - -lc
      - pnpm --filter @rakazo/db exec prisma migrate deploy && pnpm --filter @rakazo/api start
    environment:
      NODE_ENV: production
      API_HOST: "0.0.0.0"
      AUTH_PASSWORD_ENABLED: "true"
      BETTER_AUTH_SECRET: e5c82a17b8f94d0382e6c1a84f509e27c3d1b824a7e930f5c2b6d19a4e7f8021
      ENCRYPTION_KEY: 7d8f3a21b4e90c6518a2d4e7f0b93c816a5e2f10d7c4b9e382a1f0d5c6b7e892
      SCREEN_PROXY_SECRET: 9a2b4c6e8f103d52718395a0c2e4f6b81d3e5a7c9f02b4d6e8103c5a7f92e4b6
      SANDBOX_SUPERVISOR_TOKEN: 3f8a1c9e5b2d7048a1c3e5f7b9d024681a3c5e7f9b0d2f4a6c8e0b2d4f6a8c0e
      BETTER_AUTH_URL: http://umbrel.local:5175
      WEB_ORIGIN: http://umbrel.local:5175
      API_URL: http://umbrel.local:5175
      RAKAZO_HOST: umbrel.local
      DATABASE_URL: postgres://rakazo:rakazo_db_pass_9f8e7d6c5b4a@postgres:5432/rakazo
      DATA_DIR: /data
      SANDBOX_SUPERVISOR_URL: http://supervisor:7091
      WAKEUP_DRIVER: graphile
      SANDBOX_PROVIDER: docker
      AGENT_RUNTIME: pi
    volumes:
      - ${APP_DATA_DIR}/data/app:/data
    depends_on:
      permissions:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      supervisor:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    image: ghcr.io/elie222/rakazo/app:edge
    restart: on-failure
    command: ["pnpm", "--filter", "@rakazo/worker", "start"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://rakazo:rakazo_db_pass_9f8e7d6c5b4a@postgres:5432/rakazo
      DATA_DIR: /data
      SANDBOX_SUPERVISOR_URL: http://supervisor:7091
      SANDBOX_PROVIDER: docker
      WAKEUP_DRIVER: graphile
      AGENT_RUNTIME: pi
      ENCRYPTION_KEY: 7d8f3a21b4e90c6518a2d4e7f0b93c816a5e2f10d7c4b9e382a1f0d5c6b7e892
      SANDBOX_SUPERVISOR_TOKEN: 3f8a1c9e5b2d7048a1c3e5f7b9d024681a3c5e7f9b0d2f4a6c8e0b2d4f6a8c0e
    volumes:
      - ${APP_DATA_DIR}/data/app:/data
    depends_on:
      permissions:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      supervisor:
        condition: service_started
      api:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    image: ghcr.io/elie222/rakazo/app:edge
    restart: on-failure
    command: ["pnpm", "--filter", "@rakazo/web", "preview", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      NODE_ENV: production
      API_PROXY_TARGET: http://api:3100
      SCREEN_PROXY_SECRET: 9a2b4c6e8f103d52718395a0c2e4f6b81d3e5a7c9f02b4d6e8103c5a7f92e4b6
      RAKAZO_IMAGE_TAG: edge
      RAKAZO_HOST: umbrel.local
      RAKAZO_ALLOWED_HOSTS: "umbrel.local,umbrel,192.168.1.15,localhost,127.0.0.1,.local"
    depends_on:
      api:
        condition: service_started
