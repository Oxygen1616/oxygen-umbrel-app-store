services:
  app_proxy:
    environment:
      APP_HOST: oxygen-odysseus_server_1
      APP_PORT: 7000

  server:
    image: ghcr.io/odysseus-dev/odysseus:1.0.2@sha256:90517666d59da93aa6890b4718f43b49687b3b917fc9f20cf8a22dde2b8259ae
    restart: on-failure
    stop_grace_period: 1m
    depends_on:
      - ollama
    environment:
      PUID: "1000"
      PGID: "1000"
      LLM_HOST: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      AUTH_ENABLED: "true"
      LOCALHOST_BYPASS: "false"
      ODYSSEUS_ADMIN_USER: admin
      ODYSSEUS_ADMIN_PASSWORD: ${APP_PASSWORD:-umbrel}
      ALLOWED_ORIGINS: http://${DEVICE_DOMAIN_NAME}:7000
    volumes:
      - ${APP_DATA_DIR}/data/odysseus:/app/data
      - ${APP_DATA_DIR}/data/logs:/app/logs
      - ${APP_DATA_DIR}/data/ssh:/app/.ssh
      - ${APP_DATA_DIR}/data/huggingface:/app/.cache/huggingface
      - ${APP_DATA_DIR}/data/local:/app/.local
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ollama:
    image: ollama/ollama:latest
    restart: on-failure
    environment:
      OLLAMA_HOST: 0.0.0.0
    volumes:
      - ${APP_DATA_DIR}/data/ollama:/root/.ollama
