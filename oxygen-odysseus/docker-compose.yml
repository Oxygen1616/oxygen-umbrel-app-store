version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: oxygen-odysseus_server_1
      APP_PORT: 7000
      PROXY_AUTH_WHITELIST: "/api/*

  odysseus:
    image: ghcr.io/odysseus-dev/odysseus:
    # Build locally: # build: .
    container_name: oxygen-odysseus_server_1
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_MODEL=
      - OPENAI_API_KEY=
      - OPENAI_BASE_URL=
      - SECRET_KEY=
      - JWT_SECRET_KEY=
      - AUTH_ENABLED=
      - LOCALHOST_BYPASS=
      - PEGAPROX_DISABLE_AUTO_ENCRYPT: "false"
    volumes:
      - /data/app/odysseus:/app/config:rw
      - /data/app/odysseus/logs:/app/logs:rw
      - /data/app/odysseus/backups:/app/backups:rw
    ports:
      - "7000:7000/tcp"

  ollama:
    image: ollama/ollama:
    platform: 
    volumes:
      - /data/ollama:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    ports:
      - "11434:11434/tcp"

volumes:
  /data/app/odysseus:
  /data/ollama:
