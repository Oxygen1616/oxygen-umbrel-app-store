manifestVersion: 1
id: oxygen-odysseus
name: Odysseus
tagline: Self-hosted AI workspace with local and API models
icon: https://raw.githubusercontent.com/odysseus-dev/odysseus/main/static/icons/icon-512.png
category: ai
version: "1.0.3"
port: 7000
description: >-
  Odysseus is a self-hosted AI workspace for chat, agents, research, documents,
  email, notes, calendar, and local model workflows. Connect local models or
  configure an API provider in the app.


  This package includes NVIDIA GPU hardware acceleration with a bundled Ollama server.
  Download a model before using local inference, or connect to an external model server.
  Search and other integrations may require additional services or provider credentials.


  Sign in as admin with the password shown by Umbrel. App data, model downloads,
  logs, and the local package cache are persisted in the app's data directory.
developer: Odysseus Dev
website: https://odysseus-dev.github.io/odysseus/
submitter: Oxygen1616
submission: https://github.com/Oxygen1616/oxygen-umbrel-app-store
repo: https://github.com/odysseus-dev/odysseus
support: https://github.com/odysseus-dev/odysseus/issues
gallery:
  - https://raw.githubusercontent.com/odysseus-dev/odysseus/main/assets/branding/odysseus-wordmark.png
releaseNotes: >-
  v1.0.3: Enable NVIDIA GPU hardware acceleration passthrough for Odysseus and its bundled Ollama engine (using Pascal-compatible Ollama 0.5.12).
dependencies: []
path: ""
defaultUsername: "admin"
defaultPassword: "umbrel"
