description: >-
  PotionUI is an open-source, self-hosted generation studio designed for producing images, video, and audio using modern diffusion models on your own hardware or remote backends.


  Instead of overwhelming node graphs or generic wrappers, PotionUI provides curated forms exposing only the specific controls each model understands—such as resolution, camera angle, and art style.


  Key Features:


  🎨 Multi-Modal Generation: Seamlessly create images, video, and audio side-by-side supporting SDXL, Flux, Qwen-Image, Krea-2, Wan 2.1, LTX-2, MiniMax, YuE2, and more.


  👥 Multi-User & Admin Panel: Share your GPU infrastructure with multiple users and groups, assigning custom presets, models, and LLM configurations with granular access control.


  🧠 Integrated AI Assistant: PotionAI assists with prompt engineering, segment rewrites, and phrasebook completions, with external control via Model Context Protocol (MCP) clients like Claude Desktop.


  🎬 Video Director: Compose complex video shots into timed, global, and chained segments rather than struggling with one massive prompt.


  🔌 Modular Backend Architecture: Connect directly to local NVIDIA GPUs, remote ComfyUI instances, or cloud inference workers.
